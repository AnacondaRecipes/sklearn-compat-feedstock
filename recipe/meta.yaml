{% set name = "sklearn-compat" %}
{% set version = "0.1.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8fd4731b4f709b66641b8f49c954dafec7e3b60afc48f2cfd298356c713277c6

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true # [py<38]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - scikit-learn >=1.2,<1.10

test:
  source_files:
    - tests
  imports:
    - sklearn_compat
    - sklearn_compat.utils
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/sklearn-compat/sklearn-compat
  summary: Ease multi-version support for scikit-learn compatible library
  description: |
    This package provides a set of utilities to make scikit-learn estimators
    compatible with different versions of scikit-learn.
  dev_url: https://github.com/sklearn-compat/sklearn-compat
  doc_url: https://sklearn-compat.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - glemaitre
    - adrinjalali
